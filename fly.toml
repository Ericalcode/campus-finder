app = 'my-php-app'
primary_region = 'iad' # Change to your preferred region (e.g., 'ams', 'nrt', etc.)

[build]
  # Fly.io will automatically use the Dockerfile you just created

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
