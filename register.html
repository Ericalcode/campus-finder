<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <title>Register | Campus Finder</title>
</head>
<body class="container">
    <div class="glass-card" style="max-width: 400px; margin: 50px auto;">
        <h2>Create Account</h2>
        <form action="register.php" method="POST">
            <input type="text" name="name" placeholder="Full Name" required style="width:90%; margin:10px 0; padding:10px;">
            <input type="email" name="email" placeholder="Email" required style="width:90%; margin:10px 0; padding:10px;">
            <input type="text" name="phone" placeholder="Phone Number" required style="width:90%; margin:10px 0; padding:10px;">
            <input type="password" name="password" placeholder="Password" required style="width:90%; margin:10px 0; padding:10px;">
            <button type="submit" class="btn-claim">Register</button>
        </form>
        <p>Already have an account? <a href="login.html" style="color:white;">Login here</a></p>
    </div>
</body>
</html>
